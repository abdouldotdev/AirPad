name: AirPad
options:
  bundleIdPrefix: com.abdouldotdev
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"

targets:
  AirPadClient:
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: PostHog
        product: PostHog
    type: application
    platform: iOS
    sources:
      - Client
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    info:
      path: Client/Info.plist
      properties:
        CFBundleDisplayName: AirPad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: "AirPad connects to the AirPad app on your Mac over your local network. Nothing is sent to the internet."
        NSCameraUsageDescription: "AirPad uses the camera to scan the pairing code shown by the AirPad app on your Mac."
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        PostHogAPIKey: $(POSTHOG_API_KEY)
        PostHogHost: $(POSTHOG_HOST)
    settings:
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0
      PRODUCT_BUNDLE_IDENTIFIER: com.abdouldotdev.AirPadClient
      SWIFT_VERSION: 5.0
      DEVELOPMENT_TEAM: HZ3366WY57
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # 1,2 = iPhone et iPad : l'app est vendue comme universelle.
      TARGETED_DEVICE_FAMILY: "1,2"

  AirPadServer:
    type: application
    platform: macOS
    sources:
      - Server/Sources/Server
      - Server/Assets.xcassets
    info:
      path: Server/Info.plist
      properties:
        CFBundleName: AirPad
        CFBundleDisplayName: AirPad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Application d'arrière-plan : pas d'icône dans le Dock, seulement le menu.
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Abdoul Rachid Tapsoba"
        NSHighResolutionCapable: true
    settings:
      # Le plist ci-dessus fait foi ; sans cette ligne Xcode en régénère un et
      # réécrit CFBundleName avec le nom de la cible.
      GENERATE_INFOPLIST_FILE: NO
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0
      PRODUCT_BUNDLE_IDENTIFIER: com.abdouldotdev.AirPadServer
      SWIFT_VERSION: 5.0
      DEVELOPMENT_TEAM: HZ3366WY57
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Exigé par la notarisation ; l'App Sandbox reste désactivé, il empêcherait
      # l'injection d'événements clavier et souris globaux.
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_IDENTITY[sdk=macosx*]: "Developer ID Application"
