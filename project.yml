name: AirPad
options:
  bundleIdPrefix: com.abdouldotdev
targets:
  AirPadClient:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: 
      - Client
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0
      PRODUCT_BUNDLE_IDENTIFIER: com.abdouldotdev.AirPadClient
      SWIFT_VERSION: 5.0
      DEVELOPMENT_TEAM: HZ3366WY57
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_NSLocalNetworkUsageDescription: "AirPad needs local network to connect to Mac."
      INFOPLIST_KEY_NSCameraUsageDescription: "AirPad needs camera access to scan QR codes for pairing."
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES

  AirPadServer:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Server/Sources/Server
      - Server/Assets.xcassets
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0
      PRODUCT_BUNDLE_IDENTIFIER: com.abdouldotdev.AirPadServer
      SWIFT_VERSION: 5.0
      DEVELOPMENT_TEAM: HZ3366WY57
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      LSUIElement: YES
